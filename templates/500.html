<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Server error</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #f4f6fb; color: #1c2333;
         display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .box { background: #fff; border-radius: 12px; padding: 36px; max-width: 380px; text-align: center;
         box-shadow: 0 10px 30px rgba(20,20,50,0.15); }
  a { color: #4a5cf0; }
</style>
</head>
<body>
  <div class="box">
    <h1>500 · Something went wrong</h1>
    <p>An unexpected server error occurred. Please try again shortly.</p>
    <a href="/">Back to home</a>
  </div>
</body>
</html>
