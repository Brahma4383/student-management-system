<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f7a"/>
      <stop offset="45%" stop-color="#4a5cf0"/>
      <stop offset="100%" stop-color="#8f6cf5"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a4fd6"/>
      <stop offset="100%" stop-color="#453ab0"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3c3699"/>
      <stop offset="100%" stop-color="#2d2a75"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f2ff"/>
      <stop offset="100%" stop-color="#d9d5f5"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd77a"/>
      <stop offset="100%" stop-color="#e7a93f"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1180" cy="230" r="220" fill="url(#sun)"/>
  <circle cx="1180" cy="230" r="70" fill="#fff3d6"/>

  <path d="M0,560 C220,500 420,600 680,540 C940,480 1160,560 1600,500 L1600,900 L0,900 Z" fill="url(#hill2)" opacity="0.85"/>
  <path d="M0,620 C260,570 500,650 760,600 C1040,548 1300,620 1600,580 L1600,900 L0,900 Z" fill="url(#hill1)" opacity="0.9"/>

  <!-- Ground plaza -->
  <rect x="0" y="760" width="1600" height="140" fill="#efeaff"/>
  <rect x="0" y="760" width="1600" height="10" fill="#c9c0f2"/>
  <path d="M700,760 L900,760 L940,900 L660,900 Z" fill="#e2dbf7"/>

  <!-- Trees -->
  <g>
    <rect x="130" y="700" width="10" height="55" fill="#5b4636"/>
    <circle cx="135" cy="685" r="42" fill="#3f9a6a"/>
    <circle cx="105" cy="705" r="30" fill="#379065"/>
    <circle cx="165" cy="705" r="30" fill="#379065"/>
  </g>
  <g>
    <rect x="1420" y="705" width="10" height="50" fill="#5b4636"/>
    <circle cx="1425" cy="690" r="38" fill="#3f9a6a"/>
    <circle cx="1398" cy="708" r="26" fill="#379065"/>
    <circle cx="1452" cy="708" r="26" fill="#379065"/>
  </g>

  <!-- Main institute building -->
  <g>
    <rect x="560" y="470" width="480" height="290" fill="url(#building)"/>
    <rect x="560" y="470" width="480" height="14" fill="#c6bef0"/>

    <!-- Pediment / triangular roof -->
    <path d="M540,470 L800,360 L1060,470 Z" fill="#efeaff"/>
    <path d="M540,470 L800,360 L1060,470 L1040,478 L800,382 L560,478 Z" fill="#c6bef0"/>

    <!-- Central dome -->
    <circle cx="800" cy="330" r="60" fill="url(#dome)"/>
    <rect x="770" y="330" width="60" height="40" fill="#e7a93f"/>
    <rect x="793" y="255" width="14" height="45" fill="#e7a93f"/>
    <circle cx="800" cy="248" r="9" fill="#ffe9b8"/>

    <!-- Columns -->
    <g fill="#ffffff" stroke="#c6bef0" stroke-width="2">
      <rect x="590" y="500" width="26" height="230"/>
      <rect x="660" y="500" width="26" height="230"/>
      <rect x="730" y="500" width="26" height="230"/>
      <rect x="800" y="500" width="26" height="230"/>
      <rect x="870" y="500" width="26" height="230"/>
      <rect x="940" y="500" width="26" height="230"/>
      <rect x="1000" y="500" width="26" height="230"/>
    </g>
    <rect x="560" y="490" width="480" height="14" fill="#d9d5f5"/>
    <rect x="560" y="726" width="480" height="14" fill="#c6bef0"/>

    <!-- Entrance steps -->
    <rect x="740" y="740" width="120" height="10" fill="#d9d5f5"/>
    <rect x="726" y="750" width="148" height="10" fill="#c6bef0"/>
    <rect x="712" y="760" width="176" height="10" fill="#b6ade8"/>

    <!-- Windows on side wings -->
    <g fill="#8f85d6" opacity="0.55">
      <rect x="605" y="560" width="16" height="26"/>
      <rect x="675" y="560" width="16" height="26"/>
      <rect x="915" y="560" width="16" height="26"/>
      <rect x="985" y="560" width="16" height="26"/>
      <rect x="605" y="630" width="16" height="26"/>
      <rect x="675" y="630" width="16" height="26"/>
      <rect x="915" y="630" width="16" height="26"/>
      <rect x="985" y="630" width="16" height="26"/>
    </g>
  </g>

  <!-- Low side wings -->
  <rect x="330" y="600" width="230" height="160" fill="#e2dbf7"/>
  <rect x="330" y="600" width="230" height="12" fill="#c6bef0"/>
  <rect x="1040" y="600" width="230" height="160" fill="#e2dbf7"/>
  <rect x="1040" y="600" width="230" height="12" fill="#c6bef0"/>

  <!-- Flag -->
  <rect x="800" y="200" width="4" height="48" fill="#efeaff"/>
  <path d="M804,202 L850,214 L804,226 Z" fill="#ffd77a"/>
</svg>
